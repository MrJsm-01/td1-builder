name: Build Submission
description: Submit your The Division build.

labels:
  - "build"

assignees:
  - Strappazzon

body:
  - type: markdown
    attributes:
      value: >2
        **NOTE:** If you are reporting a security issue, read the
        [Security Policy](https://github.com/Strappazzon/.github/blob/-/SECURITY.md) instead of opening a public ticket.

  - type: markdown
    attributes:
      value: Read the [Contributing Guidelines](https://github.com/Strappazzon/td1-builder/blob/-/.github/CONTRIBUTING.md) before opening a ticket.

  - type: input
    id: name
    attributes:
      label: Name
      description: Name of the build.
    validations:
      required: true

  - type: textarea
    id: link
    attributes:
      label: Link
      description: Link to the build.
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Tag your build with up to five tags.
      placeholder: classified, pve, dps
    validations:
      required: false

  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to the [Code of Conduct](https://github.com/Strappazzon/.github/blob/-/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow the Code of Conduct.
          required: true
