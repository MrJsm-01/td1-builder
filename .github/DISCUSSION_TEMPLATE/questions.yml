labels:
  - "discussion"
  - "question"

body:
  - type: markdown
    attributes:
      value: >2
        **NOTE:** If you are reporting a security issue, read the
        [Security Policy](https://github.com/Strappazzon/.github/blob/-/SECURITY.md) instead of opening a public discussion.

  - type: markdown
    attributes:
      value: |2
        - Read [Support Resources](https://github.com/Strappazzon/td1-builder/blob/-/SUPPORT.md) before asking a question.
        - Make sure to adhere to the [Code of Conduct](https://github.com/Strappazzon/.github/blob/-/CODE_OF_CONDUCT.md) before creating a discussion.

  - type: textarea
    attributes:
      label: Question
      description: Ask your question.
    validations:
      required: true
